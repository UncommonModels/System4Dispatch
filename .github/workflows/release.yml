# On a version tag, build s4d-bridge (with the web app embedded) for common
# platforms and attach the binaries to a GitHub release.
name: Release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { path: System4Dispatch }
      - uses: actions/checkout@v4
        with: { repository: "${{ github.repository_owner }}/rolcb", path: rolcb }
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: wasm32-unknown-unknown }
      - uses: taiki-e/install-action@v2
        with: { tool: dioxus-cli@0.7.10 }
      - working-directory: System4Dispatch
        run: dx bundle --platform web --release -p system4dispatch
      - uses: actions/upload-artifact@v4
        with: { name: web, path: System4Dispatch/target/dx/system4dispatch/release/web/public }

  bridge:
    needs: web
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu, name: s4d-bridge-linux-x86_64 }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, name: s4d-bridge-linux-arm64 }
          - { os: macos-latest, target: aarch64-apple-darwin, name: s4d-bridge-macos-arm64 }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, name: s4d-bridge-windows-x86_64.exe }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with: { path: System4Dispatch }
      - uses: actions/checkout@v4
        with: { repository: "${{ github.repository_owner }}/rolcb", path: rolcb }
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: "${{ matrix.target }}" }
      - uses: actions/download-artifact@v4
        with: { name: web, path: System4Dispatch/target/dx/system4dispatch/release/web/public }
      - name: Build
        working-directory: System4Dispatch
        shell: bash
        run: |
          cargo build --release -p s4d-bridge --target ${{ matrix.target }}
          ext=""; [[ "${{ matrix.target }}" == *windows* ]] && ext=".exe"
          cp target/${{ matrix.target }}/release/s4d-bridge$ext ${{ matrix.name }}
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with: { files: "System4Dispatch/${{ matrix.name }}" }
