# On a version tag, bundle the desktop app for each platform and attach the
# installers to a GitHub release.
name: Release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04, name: linux-x86_64 }
          - { os: ubuntu-22.04-arm, name: linux-arm64 }
          - { os: macos-latest, name: macos-arm64 }
          - { os: windows-latest, name: windows-x86_64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with: { path: System4Dispatch }
      - uses: actions/checkout@v4
        with: { repository: "${{ github.repository_owner }}/rolcb", path: rolcb }
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with: { tool: dioxus-cli@0.7.10 }
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libxdo-dev libudev-dev libayatana-appindicator3-dev librsvg2-dev
      - name: Bundle
        working-directory: System4Dispatch
        shell: bash
        run: dx bundle --platform desktop --release -p system4dispatch --out-dir dist
      - name: Collect installers
        working-directory: System4Dispatch
        shell: bash
        run: |
          mkdir -p release
          find dist -type f \( -name '*.deb' -o -name '*.rpm' -o -name '*.AppImage' -o -name '*.dmg' -o -name '*.msi' -o -name '*-setup.exe' \) \
            -exec sh -c 'for f; do cp "$f" "release/${{ matrix.name }}-$(basename "$f")"; done' sh {} +
          ls -la release
      - uses: actions/upload-artifact@v4
        with: { name: "desktop-${{ matrix.name }}", path: System4Dispatch/release }
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with: { files: "System4Dispatch/release/*" }
