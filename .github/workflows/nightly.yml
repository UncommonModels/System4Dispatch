# Nightly Linux builds of the desktop app: an AppImage and a Flatpak bundle,
# published as a GitHub pre-release tagged `nightly` (replaced every run).
name: Nightly
on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency: { group: nightly, cancel-in-progress: true }

jobs:
  changes:
    # Skip the scheduled build when nothing landed since the last nightly.
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.check.outputs.build }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          last=$(gh api "repos/${{ github.repository }}/git/ref/tags/nightly" -q .object.sha 2>/dev/null || true)
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "$last" != "${{ github.sha }}" ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            echo "build=false" >> "$GITHUB_OUTPUT"
          fi

  desktop:
    needs: changes
    if: needs.changes.outputs.build == 'true'
    runs-on: ubuntu-22.04 # oldest supported glibc, so the AppImage runs on more distros
    steps:
      - uses: actions/checkout@v4
        with: { path: System4Dispatch }
      - uses: actions/checkout@v4
        with: { repository: "${{ github.repository_owner }}/rolcb", path: rolcb }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: System4Dispatch }
      - uses: taiki-e/install-action@v2
        with: { tool: dioxus-cli@0.7.10 }
      - name: Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libxdo-dev libudev-dev \
            libayatana-appindicator3-dev librsvg2-dev libfuse2 file
      - name: Build AppImage
        working-directory: System4Dispatch
        run: |
          dx bundle -p system4dispatch --platform desktop --release --package-types appimage --out-dir dist
          mkdir -p out
          cp "$(find dist -name '*.AppImage' | head -1)" out/System4Dispatch-nightly-x86_64.AppImage
      - name: Keep the app directory for the Flatpak
        working-directory: System4Dispatch
        run: |
          app=target/dx/system4dispatch/release/linux/app
          test -x "$app/system4dispatch"
          tar -C "$app" -czf out/app.tar.gz .
      - uses: actions/upload-artifact@v4
        with: { name: appimage, path: System4Dispatch/out/*.AppImage }
      - uses: actions/upload-artifact@v4
        with: { name: desktop-app, path: System4Dispatch/out/app.tar.gz }

  flatpak:
    needs: desktop
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: desktop-app, path: packaging/flatpak }
      - name: Unpack app
        run: |
          mkdir -p packaging/flatpak/app
          tar -C packaging/flatpak/app -xzf packaging/flatpak/app.tar.gz
          rm packaging/flatpak/app.tar.gz
      - name: Install flatpak-builder
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
      - uses: actions/cache@v4
        with:
          path: .flatpak-builder
          key: flatpak-builder-${{ hashFiles('packaging/flatpak/*.yml') }}
      - name: Build Flatpak bundle
        run: |
          flatpak-builder --user --install-deps-from=flathub --force-clean --disable-rofiles-fuse \
            --repo=repo build-dir packaging/flatpak/com.uncommonmodels.System4Dispatch.yml
          flatpak build-bundle --runtime-repo=https://dl.flathub.org/repo/flathub.flatpakrepo \
            repo System4Dispatch-nightly.flatpak com.uncommonmodels.System4Dispatch
      - uses: actions/upload-artifact@v4
        with: { name: flatpak, path: System4Dispatch-nightly.flatpak }

  release:
    needs: [desktop, flatpak]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: artifacts, pattern: "{appimage,flatpak}", merge-multiple: true }
      - name: Publish nightly pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          ls -la artifacts
          gh release delete nightly --cleanup-tag --yes || true
          gh release create nightly artifacts/* \
            --prerelease \
            --target "${{ github.sha }}" \
            --title "Nightly $(date -u +%Y-%m-%d)" \
            --notes "Automated build of \`${{ github.sha }}\` from $(date -u '+%Y-%m-%d %H:%M UTC').

          - **AppImage:** \`chmod +x System4Dispatch-nightly-x86_64.AppImage && ./System4Dispatch-nightly-x86_64.AppImage\`
          - **Flatpak:** \`flatpak install --user System4Dispatch-nightly.flatpak\` (needs the Flathub remote for the GNOME runtime)

          Nightlies are untested snapshots; use a tagged release for operating sessions."
