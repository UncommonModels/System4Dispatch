name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    # A normal run takes a few minutes; don't let a stuck step run for hours.
    timeout-minutes: 45
    steps:
      # rolcb is a path dependency (../rolcb), so check both repos out side by side.
      - uses: actions/checkout@v4
        with: { path: System4Dispatch }
      - uses: actions/checkout@v4
        with: { repository: "${{ github.repository_owner }}/rolcb", path: rolcb }
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: wasm32-unknown-unknown, components: "clippy, rustfmt" }
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: System4Dispatch }
      - name: Desktop build dependencies
        timeout-minutes: 20
        run: System4Dispatch/.github/scripts/apt-install.sh libwebkit2gtk-4.1-dev libgtk-3-dev libxdo-dev libudev-dev
      - uses: taiki-e/install-action@v2
        with: { tool: mdbook }
      - name: Formatting
        working-directory: System4Dispatch
        run: cargo fmt --all --check
      - name: Test core
        working-directory: System4Dispatch
        run: cargo test
      - name: Test core with all features (doctests, schema drift)
        working-directory: System4Dispatch
        run: cargo test -p s4d-core --all-features
      - name: Lint core
        working-directory: System4Dispatch
        run: cargo clippy -p s4d-core --all-features --all-targets -- -D warnings
      - name: API docs
        working-directory: System4Dispatch
        env: { RUSTDOCFLAGS: "-D warnings" }
        run: cargo doc -p s4d-core --no-deps --all-features
      - name: Book
        working-directory: System4Dispatch
        run: mdbook build docs
      - name: Check web app
        working-directory: System4Dispatch
        run: cargo clippy -p system4dispatch --target wasm32-unknown-unknown -- -D warnings
      - name: Check desktop app
        working-directory: System4Dispatch
        run: cargo clippy -p system4dispatch --no-default-features --features desktop -- -D warnings
