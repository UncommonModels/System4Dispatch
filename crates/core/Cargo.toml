[package]
name = "s4d-core"
description = "System4Dispatch core: layout model, dispatcher state and simulator over rolcb"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme = "../../README.md"
documentation = "https://uncommonmodels.github.io/System4Dispatch/docs/api/s4d_core/"
rust-version = "1.85"

[features]
default = []
## Derive `schemars::JsonSchema` for the layout file types.
schema = ["dep:schemars"]

[dependencies]
rolcb.workspace = true
serde.workspace = true
serde_json.workspace = true
schemars = { version = "1.2", optional = true }
roxmltree = "0.21.2"

[package.metadata.docs.rs]
all-features = true

[[example]]
name = "layout_schema"
required-features = ["schema"]
